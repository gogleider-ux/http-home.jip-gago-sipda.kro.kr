<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>home.jip-gago-sipda 통합 플랫폼</title>
<style>
/* 기존 CSS 동일 유지 */
body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f4f4f9; padding: 20px 0; box-sizing: border-box; }
.container { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 90%; max-width: 400px; box-sizing: border-box; }
.container.wide-mode { max-width: 850px; }
.view { display: none; }
.active { display: block; }
.input-group { margin-bottom: 12px; text-align: left; }
.input-group label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 0.85em; }
.input-group input, .input-group select, .input-group textarea { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 1em; }
button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 5px; }
.btn-del { background: #dc3545; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
.header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #007bff; padding-bottom: 10px; margin-bottom: 20px; }
</style>
</head>
<body>

<div id="main-container" class="container">
    <!-- 1. 로그인 화면 -->
    <div id="login-view" class="view active">
        <h2>로그인</h2>
        <div class="input-group"><label>ID (이메일)</label><input type="email" id="log-id"></div>
        <div class="input-group"><label>PW</label><input type="password" id="log-pw"></div>
        <button onclick="handleLogin()">로그인 접속</button>
        <div class="nav-link" onclick="switchView('signup-view')">회원가입 하기</div>
    </div>

    <!-- 2. 회원가입 -->
    <div id="signup-view" class="view">
        <h2>회원가입</h2>
        <div class="input-group"><label>이메일</label><input type="email" id="reg-id"></div>
        <div class="input-group"><label>비밀번호 (4자리 이상)</label><input type="password" id="reg-pw"></div>
        <button onclick="handleSignup()">가입 완료</button>
    </div>

    <!-- 3. 홈 화면 (개인정보 수정 버튼 추가됨) -->
    <div id="home-view" class="view">
        <div class="header-bar">
            <h3>홈 메인</h3>
            <button onclick="logout()" class="btn-del">로그아웃</button>
        </div>
        <div class="input-group">
            <label>비밀번호 변경</label>
            <input type="password" id="new-pw" placeholder="새 비밀번호 (4자리 이상)">
            <button onclick="changePassword()" style="background:#ffc107; color:black;">비밀번호 변경 적용</button>
        </div>
        <div id="user-info-area"></div>
    </div>

    <!-- 4. 관리자 대시보드 -->
    <div id="admin-view" class="view">
        <h2>관리자 센터</h2>
        <div id="admin-user-list"></div>
        <button onclick="logout()">관리자 로그아웃</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updatePassword, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDocs, collection } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCc6s1XMlP0ZO27SpAtWpryDVvMeoxeM_0",
      authDomain: "jipgagosipda-4d91e.firebaseapp.com",
      projectId: "jipgagosipda-4d91e",
      storageBucket: "jipgagosipda-4d91e.firebasestorage.app",
      appId: "1:915657169164:web:6f06c03437a6fe08235129"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // [중요] 새로고침 유지 설정
    setPersistence(auth, browserLocalPersistence);

    // 로그인 상태 변화 감지
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            if (user.email === "admin@jip.com") {
                switchView('admin-view');
                loadAdminData();
            } else {
                switchView('home-view');
            }
        } else {
            switchView('login-view');
        }
    });

    window.handleLogin = async () => {
        const id = document.getElementById('log-id').value;
        const pw = document.getElementById('log-pw').value;
        try {
            await signInWithEmailAndPassword(auth, id, pw);
        } catch (e) { alert("로그인 실패: " + e.message); }
    };

    window.handleSignup = async () => {
        const id = document.getElementById('reg-id').value;
        const pw = document.getElementById('reg-pw').value;
        if(pw.length < 4) return alert("4자리 이상 입력하세요.");
        try {
            const userCred = await createUserWithEmailAndPassword(auth, id, pw);
            await setDoc(doc(db, "users", userCred.user.uid), { email: id, password: pw });
            alert("가입 성공!");
        } catch (e) { alert(e.message); }
    };

    window.changePassword = async () => {
        const newPw = document.getElementById('new-pw').value;
        if(newPw.length < 4) return alert("4자리 이상 입력하세요.");
        const user = auth.currentUser;
        try {
            await updatePassword(user, newPw);
            await setDoc(doc(db, "users", user.uid), { email: user.email, password: newPw }, { merge: true });
            alert("변경 완료!");
            loadAdminData();
        } catch (e) { alert("재로그인 후 시도하세요: " + e.message); }
    };

    window.logout = () => signOut(auth);

    window.switchView = (viewId) => {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
    };

    async function loadAdminData() {
        const snapshot = await getDocs(collection(db, "users"));
        let html = "<h4>회원 목록</h4>";
        snapshot.forEach(doc => {
            const data = doc.data();
            html += `<p>${data.email} / PW: <b>${data.password}</b></p>`;
        });
        document.getElementById('admin-user-list').innerHTML = html;
    }
</script>
</body>
</html>
