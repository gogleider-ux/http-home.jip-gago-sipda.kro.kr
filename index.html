<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 웹사이트</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; }
    div { margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 8px; }
    input, textarea, button { width: 100%; margin-top: 8px; padding: 8px; box-sizing: border-box; }
    button { background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #0056b3; }
  </style>
</head>
<body>

  <!-- 1. 회원가입 및 로그인 화면 -->
  <div id="auth-section">
    <h3>로그인 / 회원가입</h3>
    <input type="email" id="email" placeholder="이메일 입력">
    <input type="password" id="password" placeholder="비밀번호 입력">
    <button id="signup-btn">회원가입</button>
    <button id="login-btn" style="background-color: #28a745;">로그인</button>
  </div>

  <!-- 2. 글 작성 및 사진 업로드 화면 -->
  <div id="post-section">
    <h3>글 쓰기 & 사진 업로드</h3>
    <input type="file" id="photo-input" accept="image/*">
    <textarea id="post-text" rows="4" placeholder="내용을 입력하세요"></textarea>
    <button id="upload-btn">글 등록하기</button>
  </div>

  <!-- Firebase & Cloudinary 통합 스크립트 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. Firebase 설정값
    const firebaseConfig = {
      apiKey: "AIzaSyCc6s1XMlP0ZO27SpAtWpryDVvMeoxeM_0",
      authDomain: "jipgagosipda-4d91e.firebaseapp.com",
      projectId: "jipgagosipda-4d91e",
      storageBucket: "jipgagosipda-4d91e.firebasestorage.app",
      messagingSenderId: "915657169164",
      appId: "1:915657169164:web:6f06c03437a6fe08235129"
    };

    // 2. Firebase 초기화
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 3. Cloudinary 설정 정보
    const CLOUD_NAME = "qtbo9ktr";
    const UPLOAD_PRESET = "ml_default"; 

    // 4. Cloudinary 이미지 업로드 함수
    async function uploadImageToCloudinary(file) {
      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", UPLOAD_PRESET);

      const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
        method: "POST",
        body: formData
      });

      const data = await response.json();
      return data.secure_url;
    }

    // 5. 화면 요소 가져오기
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const signupBtn = document.getElementById("signup-btn");
    const loginBtn = document.getElementById("login-btn");
    
    const photoInput = document.getElementById("photo-input");
    const postText = document.getElementById("post-text");
    const uploadBtn = document.getElementById("upload-btn");

    // [기능 1] 회원가입
    signupBtn.addEventListener("click", async () => {
      try {
        await createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
        alert("회원가입 성공!");
      } catch (error) {
        alert("회원가입 실패: " + error.message);
      }
    });

    // [기능 2] 로그인
    loginBtn.addEventListener("click", async () => {
      try {
        await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
        alert("로그인 성공!");
      } catch (error) {
        alert("로그인 실패: " + error.message);
      }
    });

    // [기능 3] 사진 업로드 및 게시글 저장
    uploadBtn.addEventListener("click", async () => {
      const file = photoInput.files[0];
      const text = postText.value;

      if (!text && !file) {
        alert("내용이나 사진을 입력해 주세요.");
        return;
      }

      try {
        let imageUrl = "";
        if (file) {
          alert("사진 업로드 중...");
          imageUrl = await uploadImageToCloudinary(file);
        }

        await addDoc(collection(db, "posts"), {
          content: text,
          imageUrl: imageUrl,
          createdAt: new Date()
        });

        alert("글 등록 완료!");
        postText.value = "";
        photoInput.value = "";
      } catch (error) {
        alert("등록 실패: " + error.message);
      }
    });
  </script>
</body>
</html>
